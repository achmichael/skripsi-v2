[project]
name = "prediksi-token"
version = "1.0.0"
description = "Neural network model untuk prediksi durasi token listrik prabayar PLN"
requires-python = ">=3.9"
dependencies = [
    "fastapi",
    "uvicorn",
    # tambahkan library runtime lain yang dipakai backend
]

[tool.uv]
package = false

[tool.vercel]
entrypoint = "backend.app.api.index:app"

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"
